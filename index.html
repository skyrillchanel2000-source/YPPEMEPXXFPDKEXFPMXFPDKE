<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классификация приточек</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        #search-container {
            max-width: 800px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        #search-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        #search-input:focus {
            border-color: #4285f4;
        }

        #cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .card-media {
            height: 200px;
            background-color: #e0e0e0;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity 0.2s;
            position: relative;
        }

        .card-media:hover {
            opacity: 0.9;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #4285f4;
            padding-bottom: 10px;
            min-height: 44px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .card-label {
            font-weight: 600;
            color: #555;
        }

        .card-value {
            color: #333;
            text-align: right;
            max-width: 60%;
            word-wrap: break-word;
        }
        
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            padding-top: 60px; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: rgba(0,0,0,0.9); 
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90vh;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            animation: zoom 0.3s;
        }

        .modal-iframe {
            width: 90%;
            height: 85vh;
            background: white;
            border: none;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            animation: zoom 0.3s;
        }

        @keyframes zoom {
            from {transform:scale(0)} 
            to {transform:scale(1)}
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 1001;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
        
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .no-data {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            padding: 40px;
        }
        
        .pdf-indicator {
            width: 100%;
            height: 100%;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d32f2f;
        }
        .pdf-icon { font-size: 40px; margin-bottom: 10px; }
        .pdf-text { font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Поиск...">
    </div>

    <div id="cards-container">
        <div class="no-data">Загрузка данных...</div>
    </div>

    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalContainer" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV2vI-uLfWLk8C_Yr1zt5bT4jiFYyCfm4gQFBHrQSJMUNdrWYRNtRZOhy7-f9IgNC8tpKzekwBgF_S/pub?gid=976824630&single=true&output=csv';

        let allData = [];

        // Функция исправления ссылок (GitHub и Google Drive)
        function fixUrl(url) {
            if (!url) return url;
            
            // GitHub: blob -> raw
            if (url.includes('github.com') && url.includes('/blob/')) {
                return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            // Google Drive: view -> preview
            if (url.includes('drive.google.com') && url.includes('/view')) {
                return url.replace('/view', '/preview');
            }
            return url;
        }

        async function fetchData() {
            const container = document.getElementById('cards-container');
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
                const csvText = await response.text();
                
                const rows = parseCSV(csvText);
                if (rows.length < 2) throw new Error('Таблица пуста');

                const headers = rows[0];
                const dataRows = rows.slice(1);

                const idxProject = headers.indexOf('Проект');
                const idxTitle = headers.indexOf('Титул');
                const idxBZ = headers.indexOf('БЗ');
                const idxSize = headers.indexOf('Типоразмер');
                const idxImg = headers.indexOf('IMG');
                const idxLink = headers.indexOf('Link');

                allData = dataRows.map(row => {
                    const getVal = (idx) => (idx !== -1 && row[idx] !== undefined) ? row[idx] : '';
                    
                    let imgUrl = getVal(idxImg);
                    let pdfUrl = getVal(idxLink);

                    // Исправляем ссылки
                    imgUrl = fixUrl(imgUrl);
                    pdfUrl = fixUrl(pdfUrl);

                    let mediaType = 'none';
                    let mediaSrc = '';

                    if (imgUrl && imgUrl.startsWith('http')) {
                        mediaType = 'image';
                        mediaSrc = imgUrl;
                    } else if (pdfUrl && pdfUrl.startsWith('http')) {
                        mediaType = 'pdf';
                        mediaSrc = pdfUrl;
                    }
                    
                    return {
                        project: getVal(idxProject),
                        title: getVal(idxTitle),
                        bz: getVal(idxBZ),
                        size: getVal(idxSize),
                        mediaType: mediaType,
                        mediaSrc: mediaSrc
                    };
                }).filter(item => item.project || item.title || item.bz);

                renderCards(allData);

            } catch (error) {
                console.error('Ошибка:', error);
                container.innerHTML = `
                    <div class="error-msg">
                        <h3>Не удалось загрузить данные</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function parseCSV(text) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let cell = '';
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        cell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(cell.trim());
                    cell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(cell.trim());
                    if (row.length > 0 && row.some(c => c !== '')) {
                        result.push(row);
                    }
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }
            row.push(cell.trim());
            if (row.length > 0 && row.some(c => c !== '')) {
                result.push(row);
            }
            return result;
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-data">Ничего не найдено</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let mediaHtml = '';
                
                if (item.mediaType === 'image') {
                    mediaHtml = `
                        <div class="card-media" style="background-image: url('${item.mediaSrc}')" 
                             onclick="openModal('image', '${item.mediaSrc}')">
                        </div>`;
                } else if (item.mediaType === 'pdf') {
                    mediaHtml = `
                        <div class="card-media" style="background-color: #f4f4f9; cursor: pointer;" 
                             onclick="openModal('pdf', '${item.mediaSrc}')">
                            <div class="pdf-indicator">
                                <div class="pdf-icon">📄</div>
                                <div class="pdf-text">Просмотр PDF</div>
                            </div>
                        </div>`;
                }

                let contentHtml = `
                    <div class="card-title">${item.bz || 'Без БЗ'}</div>
                    
                    <div class="card-row">
                        <span class="card-label">Проект:</span>
                        <span class="card-value">${item.project}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Титул:</span>
                        <span class="card-value">${item.title}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">БЗ:</span>
                        <span class="card-value">${item.bz}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Типоразмер:</span>
                        <span class="card-value">${item.size}</span>
                    </div>
                `;

                card.innerHTML = mediaHtml + `<div class="card-content">${contentHtml}</div>`;
                container.appendChild(card);
            });
        }

        function openModal(type, src) {
            // Если PDF - пробуем открыть в iframe, но если не выйдет - новая вкладка
            if (type === 'pdf') {
                // Для надежности сразу открываем в новой вкладке, 
                // так как браузеры часто блокируют PDF внутри iframe
                window.open(src, '_blank');
                return;
            }

            // Для картинок открываем модальное окно
            const modal = document.getElementById("mediaModal");
            const container = document.getElementById("modalContainer");
            modal.style.display = "block";
            container.innerHTML = '';

            const img = document.createElement("img");
            img.className = "modal-content";
            img.src = src;
            container.appendChild(img);
        }

        function closeModal() {
            const modal = document.getElementById("mediaModal");
            const container = document.getElementById("modalContainer");
            modal.style.display = "none";
            container.innerHTML = '';
        }

        window.onclick = function(event) {
            const modal = document.getElementById("mediaModal");
            if (event.target == modal) {
                closeModal();
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(item => 
                (item.project && item.project.toLowerCase().includes(term)) ||
                (item.title && item.title.toLowerCase().includes(term)) ||
                (item.bz && item.bz.toLowerCase().includes(term)) ||
                (item.size && item.size.toLowerCase().includes(term))
            );
            renderCards(filtered);
        });

        fetchData();
    </script>
</body>
</html>
