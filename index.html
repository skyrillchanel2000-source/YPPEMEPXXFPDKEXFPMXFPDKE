<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классификация приточек</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        #search-container {
            max-width: 800px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        #search-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        #search-input:focus {
            border-color: #4285f4;
        }

        #cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%; /* Чтобы карточки были одной высоты */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .card-image {
            height: 200px;
            background-color: #e0e0e0;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #4285f4;
            padding-bottom: 10px;
            min-height: 44px; /* Выравнивание заголовков */
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .card-label {
            font-weight: 600;
            color: #555;
        }

        .card-value {
            color: #333;
            text-align: right;
            max-width: 60%;
            word-wrap: break-word;
        }
        
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .no-data {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Поиск...">
    </div>

    <div id="cards-container">
        <div class="no-data">Загрузка данных...</div>
    </div>

    <script>
        // ВСТАВЬТЕ СЮДА ССЫЛКУ, ПОЛУЧЕННУЮ ПРИ ОПУБЛИКОВАННОМ ЛИСТЕ "Классификация приточек"
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV2vI-uLfWLk8C_Yr1zt5bT4jiFYyCfm4gQFBHrQSJMUNdrWYRNtRZOhy7-f9IgNC8tpKzekwBgF_S/pub?gid=976824630&single=true&output=csv';

        let allData = [];

        async function fetchData() {
            const container = document.getElementById('cards-container');
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
                const csvText = await response.text();
                
                const rows = parseCSV(csvText);
                
                if (rows.length < 2) {
                    throw new Error('Таблица пуста');
                }

                const headers = rows[0];
                const dataRows = rows.slice(1);

                const idxProject = headers.indexOf('Проект');
                const idxTitle = headers.indexOf('Титул');
                const idxBZ = headers.indexOf('БЗ');
                const idxImg = headers.indexOf('IMG');

                allData = dataRows.map(row => {
                    const getVal = (idx) => (idx !== -1 && row[idx] !== undefined) ? row[idx] : '';
                    
                    return {
                        project: getVal(idxProject),
                        title: getVal(idxTitle),
                        bz: getVal(idxBZ),
                        image: (idxImg !== -1 && row[idxImg] && row[idxImg].startsWith('http')) 
                               ? row[idxImg] 
                               : null
                    };
                }).filter(item => item.project || item.title || item.bz);

                renderCards(allData);

            } catch (error) {
                console.error('Ошибка:', error);
                container.innerHTML = `
                    <div class="error-msg">
                        <h3>Не удалось загрузить данные</h3>
                        <p>${error.message}</p>
                        <p>1. Убедитесь, что лист "Классификация приточек" активен при публикации.<br>
                        2. Проверьте доступ: Файл -> Поделиться -> Все в интернете с ссылкой.</p>
                    </div>
                `;
            }
        }

        function parseCSV(text) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let cell = '';
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        cell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(cell.trim());
                    cell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(cell.trim());
                    if (row.length > 0 && row.some(c => c !== '')) {
                        result.push(row);
                    }
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }
            row.push(cell.trim());
            if (row.length > 0 && row.some(c => c !== '')) {
                result.push(row);
            }
            return result;
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-data">Ничего не найдено</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let imageHtml = '';
                if (item.image) {
                    imageHtml = `<div class="card-image" style="background-image: url('${item.image}')"></div>`;
                }

                // Заголовок карточки теперь БЗ
                let contentHtml = `
                    <div class="card-title">${item.bz || 'Без БЗ'}</div>
                    
                    <div class="card-row">
                        <span class="card-label">Проект:</span>
                        <span class="card-value">${item.project}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Титул:</span>
                        <span class="card-value">${item.title}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">БЗ:</span>
                        <span class="card-value">${item.bz}</span>
                    </div>
                `;

                card.innerHTML = imageHtml + `<div class="card-content">${contentHtml}</div>`;
                container.appendChild(card);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(item => 
                (item.project && item.project.toLowerCase().includes(term)) ||
                (item.title && item.title.toLowerCase().includes(term)) ||
                (item.bz && item.bz.toLowerCase().includes(term))
            );
            renderCards(filtered);
        });

        fetchData();
    </script>
</body>
</html>
