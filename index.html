<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классификация приточек</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        #search-container {
            max-width: 800px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        #search-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        #search-input:focus {
            border-color: #4285f4;
        }

        #cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .card-media {
            height: 200px;
            background-color: #e0e0e0;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity 0.2s;
            position: relative;
        }

        .card-media:hover {
            opacity: 0.9;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #4285f4;
            padding-bottom: 10px;
            min-height: 44px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .card-label {
            font-weight: 600;
            color: #555;
        }

        .card-value {
            color: #333;
            text-align: right;
            max-width: 60%;
            word-wrap: break-word;
        }
        
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.95); 
            overflow: hidden;
        }

        .modal-content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            position: relative;
        }

        .modal-content-wrapper:active {
            cursor: grabbing;
        }

        .modal-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 1002;
        }

        .close:hover { color: #bbb; }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1002;
            backdrop-filter: blur(5px);
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            user-select: none;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.4); }
        .btn:active { transform: scale(0.95); }

        .toggle-label {
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        /* Лупа увеличена (300px) */
        .lens {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 300px;
            height: 300px;
            overflow: hidden;
            z-index: 1001;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            background: white;
        }

        .lens-img {
            position: absolute;
            transform-origin: 0 0;
        }
        
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .no-data {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            padding: 40px;
        }
        
        .pdf-indicator {
            width: 100%;
            height: 100%;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d32f2f;
        }
        .pdf-icon { font-size: 40px; margin-bottom: 10px; }
        .pdf-text { font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Поиск...">
    </div>

    <div id="cards-container">
        <div class="no-data">Загрузка данных...</div>
    </div>

    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        
        <div class="modal-content-wrapper" id="imgWrapper">
            <img id="modalImg" class="modal-img" src="" alt="">
        </div>
        
        <div id="lens" class="lens">
            <img id="lensImg" class="lens-img" src="" alt="">
        </div>

        <div class="controls">
            <div class="btn" onclick="zoomIn()">+</div>
            <div class="btn" onclick="zoomOut()">-</div>
            <div class="btn" onclick="resetZoom()" style="font-size: 12px; width: 50px;">Сброс</div>
            
            <label class="toggle-label">
                <input type="checkbox" id="lensToggle" checked onchange="toggleLens()">
                Лупа
            </label>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV2vI-uLfWLk8C_Yr1zt5bT4jiFYyCfm4gQFBHrQSJMUNdrWYRNtRZOhy7-f9IgNC8tpKzekwBgF_S/pub?gid=976824630&single=true&output=csv';

        let allData = [];
        
        let scale = 1;
        let panning = false;
        let pointX = 0, pointY = 0;
        let startX = 0, startY = 0;
        let imgTop = 0, imgLeft = 0;
        let lensEnabled = true;

        function fixUrl(url) {
            if (!url) return url;
            if (url.includes('github.com') && url.includes('/blob/')) {
                return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            if (url.includes('drive.google.com') && url.includes('/view')) {
                return url.replace('/view', '/preview');
            }
            return url;
        }

        async function fetchData() {
            const container = document.getElementById('cards-container');
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
                const csvText = await response.text();
                
                const rows = parseCSV(csvText);
                if (rows.length < 2) throw new Error('Таблица пуста');

                const headers = rows[0];
                const dataRows = rows.slice(1);

                const idxProject = headers.indexOf('Проект');
                const idxTitle = headers.indexOf('Титул');
                const idxBZ = headers.indexOf('БЗ');
                const idxSize = headers.indexOf('Типоразмер');
                const idxTAGA = headers.indexOf('Тег ВЦК основной');
                const idxTAGB = headers.indexOf('Тег ВЦК резерв');
                const idxImg = headers.indexOf('IMG');
                const idxLink = headers.indexOf('Link');

                allData = dataRows.map(row => {
                    const getVal = (idx) => (idx !== -1 && row[idx] !== undefined) ? row[idx] : '';
                    
                    let imgUrl = getVal(idxImg);
                    let pdfUrl = getVal(idxLink);

                    imgUrl = fixUrl(imgUrl);
                    pdfUrl = fixUrl(pdfUrl);

                    let mediaType = 'none';
                    let mediaSrc = '';

                    if (imgUrl && imgUrl.startsWith('http')) {
                        mediaType = 'image';
                        mediaSrc = imgUrl;
                    } else if (pdfUrl && pdfUrl.startsWith('http')) {
                        mediaType = 'pdf';
                        mediaSrc = pdfUrl;
                    }
                    
                    return {
                        project: getVal(idxProject),
                        title: getVal(idxTitle),
                        bz: getVal(idxBZ),
                        size: getVal(idxSize),
                        taga: getVal(idxTAGA),
                        tagb: getVal(idxTAGB),
                        
                        mediaType: mediaType,
                        mediaSrc: mediaSrc
                    };
                }).filter(item => item.project || item.title || item.bz || item.taga || item.tagb);

                renderCards(allData);

            } catch (error) {
                console.error('Ошибка:', error);
                container.innerHTML = `
                    <div class="error-msg">
                        <h3>Не удалось загрузить данные</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function parseCSV(text) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let cell = '';
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        cell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(cell.trim());
                    cell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(cell.trim());
                    if (row.length > 0 && row.some(c => c !== '')) {
                        result.push(row);
                    }
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }
            row.push(cell.trim());
            if (row.length > 0 && row.some(c => c !== '')) {
                result.push(row);
            }
            return result;
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-data">Ничего не найдено</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let mediaHtml = '';
                
                if (item.mediaType === 'image') {
                    mediaHtml = `
                        <div class="card-media" style="background-image: url('${item.mediaSrc}')" 
                             onclick="openModal('image', '${item.mediaSrc}')">
                        </div>`;
                } else if (item.mediaType === 'pdf') {
                    mediaHtml = `
                        <div class="card-media" style="background-color: #f4f4f9; cursor: pointer;" 
                             onclick="openModal('pdf', '${item.mediaSrc}')">
                            <div class="pdf-indicator">
                                <div class="pdf-icon">📄</div>
                                <div class="pdf-text">Просмотр PDF</div>
                            </div>
                        </div>`;
                }

                let contentHtml = `
                    <div class="card-title">${item.bz || 'Без БЗ'}</div>
                    
                    <div class="card-row">
                        <span class="card-label">Проект:</span>
                        <span class="card-value">${item.project}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Титул:</span>
                        <span class="card-value">${item.title}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">БЗ:</span>
                        <span class="card-value">${item.bz}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Тег основной:</span>
                        <span class="card-value">${item.taga}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Тег резервный:</span>
                        <span class="card-value">${item.tagb}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Типоразмер:</span>
                        <span class="card-value">${item.size}</span>
                    </div>
                `;

                card.innerHTML = mediaHtml + `<div class="card-content">${contentHtml}</div>`;
                container.appendChild(card);
            });
        }

        function openModal(type, src) {
            if (type === 'pdf') {
                window.open(src, '_blank');
                return;
            }

            const modal = document.getElementById("mediaModal");
            const img = document.getElementById("modalImg");
            const lensImg = document.getElementById("lensImg");
            
            modal.style.display = "block";
            img.src = src;
            lensImg.src = src;
            
            scale = 1;
            imgTop = 0;
            imgLeft = 0;
            updateTransform();
        }

        function closeModal() {
            document.getElementById("mediaModal").style.display = "none";
            document.getElementById("lens").style.display = "none";
        }

        function updateTransform() {
            const img = document.getElementById("modalImg");
            img.style.transform = `translate(${imgLeft}px, ${imgTop}px) scale(${scale})`;
        }

        function zoomIn() {
            scale += 0.5;
            updateTransform();
        }

        function zoomOut() {
            if (scale > 0.5) {
                scale -= 0.5;
                updateTransform();
            }
        }

        function resetZoom() {
            scale = 1;
            imgTop = 0;
            imgLeft = 0;
            updateTransform();
        }

        function toggleLens() {
            lensEnabled = document.getElementById("lensToggle").checked;
            if (!lensEnabled) {
                document.getElementById("lens").style.display = "none";
            }
        }

        // --- Логика Лупы (ИСПРАВЛЕНА) ---
        
        const wrapper = document.getElementById("imgWrapper");
        const lens = document.getElementById("lens");
        const lensImg = document.getElementById("lensImg");
        const modalImg = document.getElementById("modalImg");
        const lensRadius = 150; // Половина от 300px

        wrapper.addEventListener('mousemove', function(e) {
            if (!lensEnabled) {
                lens.style.display = "none";
                return;
            }
            
            // Получаем реальные координаты картинки на экране
            const rect = modalImg.getBoundingClientRect();
            
            // Координаты мыши относительно левого верхнего угла картинки
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // Проверяем, находится ли мышь над картинкой
            if (mouseX >= 0 && mouseX <= rect.width && mouseY >= 0 && mouseY <= rect.height) {
                lens.style.display = "block";
                
                // 1. Позиция лупы (центр лупы = курсор мыши)
                lens.style.left = (e.clientX - lensRadius) + "px";
                lens.style.top = (e.clientY - lensRadius) + "px";
                
                // 2. Настройка картинки внутри лупы
                // Увеличиваем картинку внутри лупы в 2.5 раза
                const zoomFactor = 1.5;
                
                // Ширина картинки в лупе должна быть равна ширине оригинала * зум
                lensImg.style.width = (rect.width * zoomFactor) + "px";
                lensImg.style.height = (rect.height * zoomFactor) + "px";
                
                // 3. Смещение картинки внутри лупы
                // Сдвигаем картинку так, чтобы под лупой было то, что под мышкой
                const bgX = -mouseX * zoomFactor + lensRadius;
                const bgY = -mouseY * zoomFactor + lensRadius;
                
                lensImg.style.transform = `translate(${bgX}px, ${bgY}px)`;
            } else {
                lens.style.display = "none";
            }
        });

        wrapper.addEventListener('mouseleave', function() {
            lens.style.display = "none";
        });

        // --- Перемещение (Drag & Drop) ---
        
        wrapper.addEventListener('mousedown', function(e) {
            // Не перетаскиваем, если кликнули по кнопкам (хотя они вне wrapper, но на всякий случай)
            panning = true;
            startX = e.clientX - imgLeft;
            startY = e.clientY - imgTop;
            wrapper.style.cursor = 'grabbing';
            lens.style.display = "none";
        });

        window.addEventListener('mouseup', function() {
            panning = false;
            wrapper.style.cursor = 'grab';
        });

        window.addEventListener('mousemove', function(e) {
            if (!panning) return;
            e.preventDefault();
            imgLeft = e.clientX - startX;
            imgTop = e.clientY - startY;
            updateTransform();
        });

        // Тачскрин
        wrapper.addEventListener('touchstart', function(e) {
            panning = true;
            startX = e.touches[0].clientX - imgLeft;
            startY = e.touches[0].clientY - imgTop;
            lens.style.display = "none";
        }, {passive: false});

        window.addEventListener('touchend', function() {
            panning = false;
        });

        window.addEventListener('touchmove', function(e) {
            if (!panning) return;
            e.preventDefault();
            imgLeft = e.touches[0].clientX - startX;
            imgTop = e.touches[0].clientY - startY;
            updateTransform();
        }, {passive: false});

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(item => 
                (item.project && item.project.toLowerCase().includes(term)) ||
                (item.title && item.title.toLowerCase().includes(term)) ||
                (item.bz && item.bz.toLowerCase().includes(term)) ||
                (item.taga && item.taga.toLowerCase().includes(term)) ||
                (item.tagb && item.tagb.toLowerCase().includes(term)) ||
                (item.size && item.size.toLowerCase().includes(term))
            );
            renderCards(filtered);
        });

        fetchData();
    </script>
</body>
</html>
