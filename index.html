<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классификация приточек</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        #search-container {
            max-width: 800px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .search-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            flex-shrink: 0;
            background-color: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            color: #555;
            text-decoration: none;
            transition: border-color 0.3s, color 0.3s, background-color 0.3s;
        }

        .home-btn:hover {
            border-color: #4285f4;
            color: #4285f4;
            background-color: #e8f0fe;
        }

        #search-input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        #search-input:focus {
            border-color: #4285f4;
        }

        .results-counter {
            margin-top: 8px;
            font-size: 14px;
            color: #777;
            font-weight: 600;
        }

        .search-buttons {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .advanced-search-btn {
            padding: 10px 20px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .advanced-search-btn:hover {
            background-color: #357ae8;
        }

        .advanced-search-btn.active {
            background-color: #357ae8;
        }

        .main-reset-btn {
            padding: 10px 20px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s, opacity 0.3s;
            display: none;
        }

        .main-reset-btn:hover {
            background-color: #d32f2f;
        }

        .main-reset-btn.visible {
            display: inline-block;
        }

        #advanced-panel {
            display: none;
            position: fixed;
            right: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background-color: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            padding-bottom: 50px;
            overflow-y: auto;
            z-index: 999;
            box-sizing: border-box;
        }

        #advanced-panel.visible {
            display: block;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #4285f4;
        }

        .panel-header h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
        }

        .panel-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-reset-btn {
            background: none;
            border: 1px solid #f44336;
            color: #f44336;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s, color 0.3s;
        }

        .panel-reset-btn:hover {
            background-color: #f44336;
            color: white;
        }

        .close-panel-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        .close-panel-btn:hover {
            color: #d32f2f;
        }

        #filters-container {
            padding-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }

        .filter-group select {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            background-color: white;
        }

        .filter-group select:focus {
            border-color: #4285f4;
        }

        .filter-group select.has-value {
            border-color: #4285f4;
            background-color: #e8f0fe;
        }

        #cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .card-media {
            height: 200px;
            background-color: #e0e0e0;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity 0.2s;
            position: relative;
        }

        .card-media:hover {
            opacity: 0.9;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #4285f4;
            padding-bottom: 10px;
            min-height: 44px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .card-label {
            font-weight: 600;
            color: #555;
        }

        .card-value {
            color: #333;
            text-align: right;
            max-width: 60%;
            word-wrap: break-word;
        }
        
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.95); 
            overflow: hidden;
        }

        .modal-content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            position: relative;
        }

        .modal-content-wrapper:active {
            cursor: grabbing;
        }

        .modal-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 1002;
        }

        .close:hover { color: #bbb; }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1002;
            backdrop-filter: blur(5px);
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            user-select: none;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.4); }
        .btn:active { transform: scale(0.95); }

        .toggle-label {
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .lens {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 300px;
            height: 300px;
            overflow: hidden;
            z-index: 1001;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            background: white;
        }

        .lens-img {
            position: absolute;
            transform-origin: 0 0;
        }
        
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .no-data {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            padding: 40px;
        }
        
        .pdf-indicator {
            width: 100%;
            height: 100%;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d32f2f;
        }
        .pdf-icon { font-size: 40px; margin-bottom: 10px; }
        .pdf-text { font-weight: bold; font-size: 14px; }

        .date-badge {
            display: inline-block;
            background-color: #4285f4;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .filter-divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div id="search-container">
        <div class="search-row">
            <a class="home-btn" href="https://ferrumgovorov-netizen.github.io/KIP/index.html" title="На главную">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>
            <input type="text" id="search-input" placeholder="Поиск...">
        </div>
        <div class="results-counter" id="results-counter">0/0</div>
        <div class="search-buttons">
            <button class="advanced-search-btn" onclick="toggleAdvancedSearch()">Расширенный поиск</button>
            <button class="main-reset-btn" id="main-reset-btn" onclick="resetFilters()">✕ Сбросить фильтры</button>
        </div>
    </div>

    <div id="advanced-panel">
        <div class="panel-header">
            <h3>Фильтры</h3>
            <div class="panel-header-actions">
                <button class="panel-reset-btn" onclick="resetFilters()">Сброс</button>
                <button class="close-panel-btn" onclick="toggleAdvancedSearch()">&times;</button>
            </div>
        </div>
        <div id="filters-container"></div>
    </div>

    <div id="cards-container">
        <div class="no-data">Загрузка данных...</div>
    </div>

    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        
        <div class="modal-content-wrapper" id="imgWrapper">
            <img id="modalImg" class="modal-img" src="" alt="">
        </div>
        
        <div id="lens" class="lens">
            <img id="lensImg" class="lens-img" src="" alt="">
        </div>

        <div class="controls">
            <div class="btn" onclick="zoomIn()">+</div>
            <div class="btn" onclick="zoomOut()">-</div>
            <div class="btn" onclick="resetZoom()" style="font-size: 12px; width: 50px;">Сброс</div>
            
            <label class="toggle-label">
                <input type="checkbox" id="lensToggle" checked onchange="toggleLens()">
                Лупа
            </label>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV2vI-uLfWLk8C_Yr1zt5bT4jiFYyCfm4gQFBHrQSJMUNdrWYRNtRZOhy7-f9IgNC8tpKzekwBgF_S/pub?gid=976824630&single=true&output=csv';

        let allData = [];
        let filteredData = [];
        
        let scale = 1;
        let panning = false;
        let pointX = 0, pointY = 0;
        let startX = 0, startY = 0;
        let imgTop = 0, imgLeft = 0;
        let lensEnabled = true;

        const filterFields = [
            { key: 'project', label: 'Проект' },
            { key: 'title', label: 'Титул' },
            { key: 'bz', label: 'БЗ' },
            { key: 'size', label: 'Типоразмер' },
            { key: 'taga', label: 'Тег основной' },
            { key: 'tagb', label: 'Тег резервный' },
            { key: 'vccType', label: 'Тип ВЦК' },
            { key: 'totalLength', label: 'Общая длина' },
            { key: 'heaterType', label: 'Тип нагревателя' },
            { key: 'filterCount', label: 'Кол-во фильтров' },
            { key: 'panelAfterED', label: 'Наличие панели после ЭД' },
            { key: 'evaporator', label: 'Испаритель' },
            { key: 'sensor', label: 'Датчик' },
            { key: 'street', label: 'Улица' },
            { key: 'chrpED', label: 'ЧРП, ЭД' },
            { key: 'serviceSide', label: 'Сторона обслуживания' },
            { key: 'input', label: 'Вход' },
            { key: 'output', label: 'Выход' },
            { key: 'vertValve', label: 'Вертик. клапан' },
            { key: 'horizValve', label: 'Гор. клапан' },
            { key: 'thermostats', label: 'Термостаты' },
            { key: 'date', label: 'Дата' }
        ];

        function fixUrl(url) {
            if (!url) return url;
            
            // GitHub: преобразуем blob в raw для прямого доступа
            if (url.includes('github.com') && url.includes('/blob/')) {
                return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            
            return url;
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            
            const trimmed = dateStr.trim();
            
            const dotParts = trimmed.split('.');
            if (dotParts.length === 3) {
                const day = parseInt(dotParts[0], 10);
                const month = parseInt(dotParts[1], 10) - 1;
                const year = parseInt(dotParts[2], 10);
                const date = new Date(year, month, day);
                if (!isNaN(date.getTime())) return date;
            }
            
            const slashParts = trimmed.split('/');
            if (slashParts.length === 3) {
                const day = parseInt(slashParts[0], 10);
                const month = parseInt(slashParts[1], 10) - 1;
                const year = parseInt(slashParts[2], 10);
                const date = new Date(year, month, day);
                if (!isNaN(date.getTime())) return date;
            }
            
            const date = new Date(trimmed);
            return isNaN(date.getTime()) ? null : date;
        }

        async function fetchData() {
            const container = document.getElementById('cards-container');
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
                const csvText = await response.text();
                
                const rows = parseCSV(csvText);
                if (rows.length < 2) throw new Error('Таблица пуста');

                const headers = rows[0];
                const dataRows = rows.slice(1);

                const idxProject = headers.indexOf('Проект');
                const idxTitle = headers.indexOf('Титул');
                const idxBZ = headers.indexOf('БЗ');
                const idxSize = headers.indexOf('Типоразмер');
                const idxTAGA = headers.indexOf('Тег ВЦК основной');
                const idxTAGB = headers.indexOf('Тег ВЦК резерв');
                const idxImg = headers.indexOf('IMG');
                const idxLink = headers.indexOf('Link');
                
                const idxVccType = headers.indexOf('Тип ВЦК');
                const idxTotalLength = headers.indexOf('Общая длина');
                const idxHeaterType = headers.indexOf('Тип нагревателя');
                const idxFilterCount = headers.indexOf('Кол-во фильтров');
                const idxPanelAfterED = headers.indexOf('Наличие панели после ЭД');
                const idxEvaporator = headers.indexOf('Испаритель');
                const idxSensor = headers.indexOf('Датчик');
                const idxStreet = headers.indexOf('Улица');
                const idxChrpED = headers.indexOf('ЧРП, ЭД');
                const idxServiceSide = headers.indexOf('Сторона обслуживания');
                const idxInput = headers.indexOf('Вход');
                const idxOutput = headers.indexOf('Выход');
                const idxVertValve = headers.indexOf('Вертик. клапан');
                const idxHorizValve = headers.indexOf('Гор. клапан');
                const idxThermostats = headers.indexOf('Термостаты');
                const idxDate = headers.indexOf('Дата');

                allData = dataRows.map(row => {
                    const getVal = (idx) => (idx !== -1 && row[idx] !== undefined) ? row[idx] : '';
                    
                    let imgUrl = fixUrl(getVal(idxImg));
                    let pdfUrl = fixUrl(getVal(idxLink));

                    let mediaType = 'none';
                    let mediaSrc = '';

                    if (imgUrl && imgUrl.startsWith('http')) {
                        mediaType = 'image';
                        mediaSrc = imgUrl;
                    } else if (pdfUrl && pdfUrl.startsWith('http')) {
                        mediaType = 'pdf';
                        mediaSrc = pdfUrl;
                    }
                    
                    const dateStr = getVal(idxDate);
                    const parsedDate = parseDate(dateStr);
                    
                    return {
                        project: getVal(idxProject),
                        title: getVal(idxTitle),
                        bz: getVal(idxBZ),
                        size: getVal(idxSize),
                        taga: getVal(idxTAGA),
                        tagb: getVal(idxTAGB),
                        
                        vccType: getVal(idxVccType),
                        totalLength: getVal(idxTotalLength),
                        heaterType: getVal(idxHeaterType),
                        filterCount: getVal(idxFilterCount),
                        panelAfterED: getVal(idxPanelAfterED),
                        evaporator: getVal(idxEvaporator),
                        sensor: getVal(idxSensor),
                        street: getVal(idxStreet),
                        chrpED: getVal(idxChrpED),
                        serviceSide: getVal(idxServiceSide),
                        input: getVal(idxInput),
                        output: getVal(idxOutput),
                        vertValve: getVal(idxVertValve),
                        horizValve: getVal(idxHorizValve),
                        thermostats: getVal(idxThermostats),
                        date: dateStr,
                        parsedDate: parsedDate,
                        
                        mediaType: mediaType,
                        mediaSrc: mediaSrc
                    };
                }).filter(item => item.project || item.title || item.bz || item.taga || item.tagb);

                filteredData = [...allData];
                sortData(filteredData, 'newest');
                buildFilterPanel();
                updateAllFilterOptions();
                applyFilters();

            } catch (error) {
                console.error('Ошибка:', error);
                container.innerHTML = `
                    <div class="error-msg">
                        <h3>Не удалось загрузить данные</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function parseCSV(text) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let cell = '';
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        cell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(cell.trim());
                    cell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(cell.trim());
                    if (row.length > 0 && row.some(c => c !== '')) {
                        result.push(row);
                    }
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }
            row.push(cell.trim());
            if (row.length > 0 && row.some(c => c !== '')) {
                result.push(row);
            }
            return result;
        }

        function sortData(data, sortOrder) {
            if (sortOrder === 'oldest') {
                data.sort((a, b) => {
                    if (!a.parsedDate && !b.parsedDate) return 0;
                    if (!a.parsedDate) return -1;
                    if (!b.parsedDate) return 1;
                    return a.parsedDate - b.parsedDate;
                });
            } else {
                data.sort((a, b) => {
                    if (!a.parsedDate && !b.parsedDate) return 0;
                    if (!a.parsedDate) return 1;
                    if (!b.parsedDate) return -1;
                    return b.parsedDate - a.parsedDate;
                });
            }
        }

        function buildFilterPanel() {
            const container = document.getElementById('filters-container');
            container.innerHTML = '';

            filterFields.forEach((field) => {
                if (field.key === 'tagb') {
                    const divider = document.createElement('div');
                    divider.className = 'filter-divider';
                    container.appendChild(divider);
                }

                const group = document.createElement('div');
                group.className = 'filter-group';
                
                const label = document.createElement('label');
                label.innerHTML = field.label;
                
                const select = document.createElement('select');
                select.id = `filter-${field.key}`;
                
                if (field.key === 'date') {
                    select.innerHTML = '<option value="">По умолчанию</option>';
                    const newestOpt = document.createElement('option');
                    newestOpt.value = 'newest';
                    newestOpt.textContent = 'Сначала новые';
                    const oldestOpt = document.createElement('option');
                    oldestOpt.value = 'oldest';
                    oldestOpt.textContent = 'Сначала старые';
                    select.appendChild(newestOpt);
                    select.appendChild(oldestOpt);
                } else {
                    select.innerHTML = '<option value="">Все</option>';
                }
                
                select.addEventListener('change', applyFilters);
                
                group.appendChild(label);
                group.appendChild(select);
                container.appendChild(group);
            });
        }

        function getActiveFilters() {
            const filters = {};
            filterFields.forEach(field => {
                if (field.key === 'date') return;
                const select = document.getElementById(`filter-${field.key}`);
                if (select && select.value) {
                    filters[field.key] = select.value;
                }
            });
            return filters;
        }

        function getSearchTerm() {
            return document.getElementById('search-input').value.toLowerCase();
        }

        function getSortOrder() {
            const dateSelect = document.getElementById('filter-date');
            return (dateSelect && dateSelect.value) ? dateSelect.value : 'newest';
        }

        function hasActiveFilters() {
            const filters = getActiveFilters();
            const hasSearch = document.getElementById('search-input').value.trim() !== '';
            const dateSelect = document.getElementById('filter-date');
            const hasDateFilter = dateSelect && dateSelect.value !== '';
            return Object.keys(filters).length > 0 || hasSearch || hasDateFilter;
        }

        function updateResetButtonVisibility() {
            const mainResetBtn = document.getElementById('main-reset-btn');
            if (hasActiveFilters()) {
                mainResetBtn.classList.add('visible');
            } else {
                mainResetBtn.classList.remove('visible');
            }
        }

        function updateCounter() {
            const counter = document.getElementById('results-counter');
            counter.textContent = `${filteredData.length}/${allData.length}`;
        }

        function getFilteredDataset(excludeKey = null) {
            const filters = getActiveFilters();
            const searchInput = getSearchTerm();

            return allData.filter(item => {
                if (searchInput) {
                    const matchesSearch =
                        (item.project && item.project.toLowerCase().includes(searchInput)) ||
                        (item.title && item.title.toLowerCase().includes(searchInput)) ||
                        (item.bz && item.bz.toLowerCase().includes(searchInput)) ||
                        (item.taga && item.taga.toLowerCase().includes(searchInput)) ||
                        (item.tagb && item.tagb.toLowerCase().includes(searchInput)) ||
                        (item.size && item.size.toLowerCase().includes(searchInput));
                    if (!matchesSearch) return false;
                }

                for (const key in filters) {
                    if (key === excludeKey) continue;
                    if (item[key] !== filters[key]) return false;
                }

                return true;
            });
        }

        function updateFilterOptions(field, dataset) {
            const select = document.getElementById(`filter-${field.key}`);
            if (!select || field.key === 'date') return;

            const currentValue = select.value;
            const uniqueValues = [...new Set(dataset.map(item => item[field.key]).filter(val => val))].sort();

            select.innerHTML = '<option value="">Все</option>';
            
            uniqueValues.forEach(val => {
                const option = document.createElement('option');
                option.value = val;
                option.textContent = val;
                select.appendChild(option);
            });

            if (currentValue && uniqueValues.includes(currentValue)) {
                select.value = currentValue;
            } else if (currentValue) {
                select.value = '';
            }

            if (select.value) {
                select.classList.add('has-value');
            } else {
                select.classList.remove('has-value');
            }
        }

        function updateAllFilterOptions() {
            filterFields.forEach(field => {
                if (field.key === 'date') return;
                const dataset = getFilteredDataset(field.key);
                updateFilterOptions(field, dataset);
            });
        }

        function applyFilters() {
            const searchInput = getSearchTerm();
            const sortOrder = getSortOrder();
            const filters = getActiveFilters();

            filteredData = allData.filter(item => {
                if (searchInput) {
                    const matchesSearch =
                        (item.project && item.project.toLowerCase().includes(searchInput)) ||
                        (item.title && item.title.toLowerCase().includes(searchInput)) ||
                        (item.bz && item.bz.toLowerCase().includes(searchInput)) ||
                        (item.taga && item.taga.toLowerCase().includes(searchInput)) ||
                        (item.tagb && item.tagb.toLowerCase().includes(searchInput)) ||
                        (item.size && item.size.toLowerCase().includes(searchInput));
                    if (!matchesSearch) return false;
                }

                for (const key in filters) {
                    if (item[key] !== filters[key]) return false;
                }

                return true;
            });

            sortData(filteredData, sortOrder);
            updateAllFilterOptions();
            updateResetButtonVisibility();
            updateCounter();
            renderCards(filteredData);
        }

        function resetFilters() {
            filterFields.forEach(field => {
                const select = document.getElementById(`filter-${field.key}`);
                if (select) {
                    select.value = '';
                    select.classList.remove('has-value');
                }
            });
            document.getElementById('search-input').value = '';
            applyFilters();
        }

        function toggleAdvancedSearch() {
            const panel = document.getElementById('advanced-panel');
            const btn = document.querySelector('.advanced-search-btn');
            panel.classList.toggle('visible');
            btn.classList.toggle('active');
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="no-data">Ничего не найдено</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let mediaHtml = '';
                
                if (item.mediaType === 'image') {
                    mediaHtml = `
                        <div class="card-media" style="background-image: url('${item.mediaSrc}')" 
                             onclick="openModal('image', '${item.mediaSrc}')">
                        </div>`;
                } else if (item.mediaType === 'pdf') {
                    mediaHtml = `
                        <div class="card-media" style="background-color: #f4f4f9; cursor: pointer;" 
                             onclick="openModal('pdf', '${item.mediaSrc}')">
                            <div class="pdf-indicator">
                                <div class="pdf-icon">📄</div>
                                <div class="pdf-text">Просмотр PDF</div>
                            </div>
                        </div>`;
                }

                let contentHtml = `
                    <div class="card-title">${item.bz || 'Без БЗ'}</div>
                    
                    <div class="card-row">
                        <span class="card-label">Проект:</span>
                        <span class="card-value">${item.project}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Титул:</span>
                        <span class="card-value">${item.title}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">БЗ:</span>
                        <span class="card-value">${item.bz}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Тег основной:</span>
                        <span class="card-value">${item.taga}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Тег резервный:</span>
                        <span class="card-value">${item.tagb}</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">Типоразмер:</span>
                        <span class="card-value">${item.size}</span>
                    </div>
                `;

                if (item.date) {
                    contentHtml += `<div class="date-badge">📅 ${item.date}</div>`;
                }

                card.innerHTML = mediaHtml + `<div class="card-content">${contentHtml}</div>`;
                container.appendChild(card);
            });
        }

        function openModal(type, src) {
            if (type === 'pdf') {
                window.open(src, '_blank');
                return;
            }

            const modal = document.getElementById("mediaModal");
            const img = document.getElementById("modalImg");
            const lensImg = document.getElementById("lensImg");
            
            modal.style.display = "block";
            img.src = src;
            lensImg.src = src;
            
            scale = 1;
            imgTop = 0;
            imgLeft = 0;
            updateTransform();
        }

        function closeModal() {
            document.getElementById("mediaModal").style.display = "none";
            document.getElementById("lens").style.display = "none";
        }

        function updateTransform() {
            const img = document.getElementById("modalImg");
            img.style.transform = `translate(${imgLeft}px, ${imgTop}px) scale(${scale})`;
        }

        function zoomIn() {
            scale += 0.5;
            updateTransform();
        }

        function zoomOut() {
            if (scale > 0.5) {
                scale -= 0.5;
                updateTransform();
            }
        }

        function resetZoom() {
            scale = 1;
            imgTop = 0;
            imgLeft = 0;
            updateTransform();
        }

        function toggleLens() {
            lensEnabled = document.getElementById("lensToggle").checked;
            if (!lensEnabled) {
                document.getElementById("lens").style.display = "none";
            }
        }

        const wrapper = document.getElementById("imgWrapper");
        const lens = document.getElementById("lens");
        const lensImg = document.getElementById("lensImg");
        const modalImg = document.getElementById("modalImg");
        const lensRadius = 150;

        wrapper.addEventListener('mousemove', function(e) {
            if (!lensEnabled) {
                lens.style.display = "none";
                return;
            }
            
            const rect = modalImg.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (mouseX >= 0 && mouseX <= rect.width && mouseY >= 0 && mouseY <= rect.height) {
                lens.style.display = "block";
                lens.style.left = (e.clientX - lensRadius) + "px";
                lens.style.top = (e.clientY - lensRadius) + "px";
                
                const zoomFactor = 1.5;
                lensImg.style.width = (rect.width * zoomFactor) + "px";
                lensImg.style.height = (rect.height * zoomFactor) + "px";
                
                const bgX = -mouseX * zoomFactor + lensRadius;
                const bgY = -mouseY * zoomFactor + lensRadius;
                
                lensImg.style.transform = `translate(${bgX}px, ${bgY}px)`;
            } else {
                lens.style.display = "none";
            }
        });

        wrapper.addEventListener('mouseleave', function() {
            lens.style.display = "none";
        });

        wrapper.addEventListener('mousedown', function(e) {
            panning = true;
            startX = e.clientX - imgLeft;
            startY = e.clientY - imgTop;
            wrapper.style.cursor = 'grabbing';
            lens.style.display = "none";
        });

        window.addEventListener('mouseup', function() {
            panning = false;
            wrapper.style.cursor = 'grab';
        });

        window.addEventListener('mousemove', function(e) {
            if (!panning) return;
            e.preventDefault();
            imgLeft = e.clientX - startX;
            imgTop = e.clientY - startY;
            updateTransform();
        });

        wrapper.addEventListener('touchstart', function(e) {
            panning = true;
            startX = e.touches[0].clientX - imgLeft;
            startY = e.touches[0].clientY - imgTop;
            lens.style.display = "none";
        }, {passive: false});

        window.addEventListener('touchend', function() {
            panning = false;
        });

        window.addEventListener('touchmove', function(e) {
            if (!panning) return;
            e.preventDefault();
            imgLeft = e.touches[0].clientX - startX;
            imgTop = e.touches[0].clientY - startY;
            updateTransform();
        }, {passive: false});

        document.getElementById('search-input').addEventListener('input', () => {
            applyFilters();
        });

        fetchData();
    </script>
</body>
</html>
